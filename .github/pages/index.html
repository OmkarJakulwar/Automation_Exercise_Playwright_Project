<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Automation Exercise test reports</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1f2328;
        --muted: #59636e;
        --card: #f6f8fa;
        --border: #d1d9e0;
        --link: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --text: #e6edf3;
          --muted: #9198a1;
          --card: #151b23;
          --border: #3d444d;
          --link: #4493f8;
        }
      }
      body {
        margin: 0;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 4px;
      }
      p {
        color: var(--muted);
        margin: 0 0 24px;
      }
      a.card {
        display: block;
        padding: 16px 20px;
        margin-bottom: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        text-decoration: none;
      }
      a.card:hover,
      a.card:focus-visible {
        border-color: var(--link);
      }
      a.card strong {
        color: var(--link);
      }
      a.card span {
        display: block;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Automation Exercise test reports</h1>
      <p>Latest run on <code>main</code>. Rebuilt by GitHub Actions on every push.</p>
      <a class="card" href="playwright-report/">
        <strong>Playwright HTML report</strong>
        <span>Every test, step and attachment, with traces for retried failures.</span>
      </a>
      <a class="card" href="allure-report/">
        <strong>Allure report</strong>
        <span>Trends across runs, failure categories and the environment the run used.</span>
      </a>
    </main>
  </body>
</html>
